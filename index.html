<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>AeroChat</title>
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #7df9ff 0%, #004b7a 40%, #001322 100%);
  background-attachment: fixed;
}

/* Центрируем контейнер */
#app {
  width: 420px;
  margin: 40px auto;
  padding: 20px;
  border-radius: 20px;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(20px);
  box-shadow: 0 0 40px rgba(0,255,255,0.5);
  border: 1px solid rgba(255,255,255,0.6);
}

/* Заголовок */
h1 {
  text-align: center;
  color: white;
  text-shadow: 0 0 12px #00eaff;
  margin-bottom: 6px;
}

.subtitle {
  text-align: center;
  color: rgba(255,255,255,0.8);
  font-size: 13px;
  margin-bottom: 18px;
}

/* Поля ввода */
input {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,0.75);
  font-size: 15px;
  outline: none;
  box-shadow: inset 0 0 8px rgba(0,0,0,0.15);
}

/* Кнопка */
button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #00eaff, #7df9ff);
  color: black;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 15px #00eaff;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.03);
  box-shadow: 0 0 25px #00eaff;
}

/* Поле чата */
#chat {
  margin-top: 18px;
  max-height: 280px;
  overflow-y: auto;
  padding: 10px;
  border-radius: 15px;
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(15px);
  box-shadow: inset 0 0 25px rgba(0,255,255,0.25);
}

/* Сообщения */
.msg {
  background: rgba(255,255,255,0.9);
  padding: 10px;
  margin: 8px 0;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,255,255,0.3);
  font-size: 14px;
}

.msg b {
  color: #0077aa;
}

/* Системное сообщение */
.msg.system {
  background: rgba(0,234,255,0.15);
  border: 1px dashed rgba(0,234,255,0.7);
  color: white;
}

/* Статус сервера */
#server-status {
  margin-top: 10px;
  padding: 10px;
  border-radius: 10px;
  background: rgba(255,255,255,0.4);
  backdrop-filter: blur(10px);
  font-size: 14px;
  text-align: center;
  box-shadow: 0 0 10px rgba(0,255,255,0.4);
  transition: 0.3s ease;
}
</style>
</head>
<body>

<div id="app">
  <h1>AeroChat</h1>
  <div class="subtitle">Frutiger Aero мессенджер</div>

  <input id="name" placeholder="Ваше имя">
  <input id="msg" placeholder="Сообщение">

  <button onclick="send()">Отправить</button>

  <div id="server-status">Проверка сервера…</div>

  <div id="chat">
    <div class="msg system">
      <b>AeroChat:</b> Добро пожаловать! Сообщения появятся здесь.
    </div>
  </div>
</div>

<script>
const SERVER = "https://aero-chat-server.onrender.com"; // твой сервер

// Отправка сообщения
async function send() {
  const name = document.getElementById("name").value.trim();
  const msg = document.getElementById("msg").value.trim();
  if (!name || !msg) return;

  try {
    await fetch(SERVER + "/send", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({name, msg})
    });
    document.getElementById("msg").value = "";
  } catch (e) {
    console.log("Ошибка отправки:", e);
  }
}

// Загрузка сообщений
async function load() {
  try {
    const r = await fetch(SERVER + "/messages");
    const data = await r.json();
    if (!Array.isArray(data)) return;

    document.getElementById("chat").innerHTML =
      data.map(m => `
        <div class="msg">
          <b>${escapeHtml(m.name)}:</b> ${escapeHtml(m.msg)}
        </div>
      `).join("");
  } catch (e) {}
}

// Проверка сервера
async function checkServer() {
  const statusBox = document.getElementById("server-status");
  try {
    const r = await fetch(SERVER + "/messages");
    if (r.ok) {
      statusBox.innerHTML = "🟢 Сервер работает";
      statusBox.style.background = "rgba(0,255,150,0.35)";
      statusBox.style.boxShadow = "0 0 15px rgba(0,255,150,0.6)";
    } else {
      statusBox.innerHTML = "🔴 Сервер не отвечает";
      statusBox.style.background = "rgba(255,0,0,0.35)";
      statusBox.style.boxShadow = "0 0 15px rgba(255,0,0,0.6)";
    }
  } catch {
    statusBox.innerHTML = "🔴 Сервер недоступен";
    statusBox.style.background = "rgba(255,0,0,0.35)";
    statusBox.style.boxShadow = "0 0 15px rgba(255,0,0,0.6)";
  }
}

// Защита от HTML
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// Интервалы
setInterval(load, 1000);
setInterval(checkServer, 5000);
checkServer();
load();
</script>

</body>
</html>
