<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AeroChat</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #7df9ff 0%, #004b7a 40%, #001322 100%);
  background-attachment: fixed;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
}

#app {
  width: 420px;
  max-width: 90%;
  margin: 40px auto;
  padding: 20px;
  border-radius: 20px;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(20px);
  box-shadow: 0 0 40px rgba(0,255,255,0.5);
  border: 1px solid rgba(255,255,255,0.6);
}

h1 {
  text-align: center;
  color: white;
  text-shadow: 0 0 12px #00eaff;
  margin-bottom: 6px;
  font-size: 1.8em;
}

input, button {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 12px;
  border: none;
  font-size: 1em;
  box-sizing: border-box;
}

input {
  background: rgba(255,255,255,0.75);
  box-shadow: inset 0 0 8px rgba(0,0,0,0.15);
}

button {
  margin-top: 10px;
  background: linear-gradient(135deg, #00eaff, #7df9ff);
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 15px #00eaff;
  transition: 0.2s;
}

button:hover { transform: scale(1.03); }
button:active { transform: scale(0.98); }

#server-status {
  margin-top: 10px;
  padding: 10px;
  border-radius: 10px;
  background: rgba(255,255,255,0.4);
  backdrop-filter: blur(10px);
  font-size: 0.9em;
  text-align: center;
  box-shadow: 0 0 10px rgba(0,255,255,0.4);
}

#chat {
  margin-top: 18px;
  max-height: 280px;
  overflow-y: auto;
  padding: 10px;
  border-radius: 15px;
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(15px);
  box-shadow: inset 0 0 25px rgba(0,255,255,0.25);
}

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(0,234,255,0.4);
  display: inline-flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
  margin-right: 8px;
  color: #004b7a;
  box-shadow: 0 0 6px rgba(0,234,255,0.6);
}

.msg {
  background: rgba(255,255,255,0.9);
  padding: 10px;
  margin: 8px 0;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,255,255,0.3);
  font-size: 0.95em;
  display: flex;
  align-items: center;
  animation: fadeIn 0.25s ease;
}

.msg b { color: #0077aa; }

.msg.system {
  background: rgba(0,234,255,0.15);
  border: 1px dashed rgba(0,234,255,0.7);
  color: white;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>
<div id="app">
  <h1>AeroChat</h1>

  <input id="name" placeholder="Ваше имя">
  <input id="msg" placeholder="Сообщение">
  <button onclick="send()">Отправить</button>

  <div id="server-status">Проверка сервера…</div>

  <div id="chat">
  </div>
</div>

<script>
const SERVER = "https://aero-chat-server.onrender.com";

const nameEl = document.getElementById("name");
const msgEl = document.getElementById("msg");
const chat = document.getElementById("chat");
const statusBox = document.getElementById("server-status");

let lastCount = 0;

// Универсальный запрос
async function api(path, options = {}) {
  try {
    const r = await fetch(SERVER + path, options);
    return r.ok ? r.json() : null;
  } catch {
    return null;
  }
}

// Отправка сообщения
async function send() {
  const name = nameEl.value.trim();
  const msg = msgEl.value.trim();
  if (!name || !msg) return;

  await api("/send", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ name, msg })
  });

  msgEl.value = "";
}

// Рендер сообщения
function renderMessage({ name, msg }) {
  const div = document.createElement("div");
  div.className = "msg";
  div.innerHTML = `
    <div class="avatar">${escapeHtml(name[0].toUpperCase())}</div>
    <p><b>${escapeHtml(name)}: </b>${escapeHtml(msg)}</p>
  `;
  return div;
}

// Загрузка сообщений
async function load() {
  const data = await api("/messages");
  if (!data) return;

  const sys = document.querySelector(".msg.system");

  // Если нет сообщений — показываем системную плашку (один раз)
  if (data.length === 0) {
    if (!sys) {
      chat.innerHTML = `
        <div class="msg system">
          <p><b>AeroChat: </b>Сообщения появятся здесь.</p>
        </div>`;
    }
    lastCount = 0;
    return;
  }

  // Если появились сообщения — удаляем системную плашку (один раз)
  if (sys) sys.remove();

  // Добавляем только новые сообщения
  if (data.length > lastCount) {
    const fragment = document.createDocumentFragment();
    data.slice(lastCount).forEach(m => fragment.appendChild(renderMessage(m)));
    chat.appendChild(fragment);
    chat.scrollTop = chat.scrollHeight;
    lastCount = data.length;
  }
}

// Проверка сервера
async function checkServer() {
  const ok = await api("/messages");
  const good = ok !== null;

  statusBox.innerHTML = good ? "🟢 Сервер работает" : "🔴 Сервер недоступен";
  statusBox.style.background = good
    ? "rgba(0,255,150,0.35)"
    : "rgba(255,0,0,0.35)";
  statusBox.style.boxShadow = good
    ? "0 0 15px rgba(0,255,150,0.6)"
    : "0 0 15px rgba(255,0,0,0.6)";
}

// Экранирование HTML
const escapeHtml = str =>
  str.replace(/[&<>]/g, t => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[t]));

// Интервалы
setInterval(load, 1000);
setInterval(checkServer, 5000);

checkServer();
load();

// Enter для отправки
msgEl.addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});
</script>
</body>
</html>
